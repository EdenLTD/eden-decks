<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<title>学習法資料｜夏前最後の逆転合格戦略会議｜横浜｜Eden</title>
<style>
  :root{
    --navy:#0e2540; --ink:#1d2733; --sub:#5e6b7b; --line:#e7eaf0;
    --gold:#c79a3c; --gold-2:#a9802a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#e9e3d6; color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
    line-height:1.8; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; background:#fff; box-shadow:0 0 80px rgba(14,37,64,.18)}
  header{background:var(--navy); color:#fff; text-align:center; padding:48px 30px 40px}
  header .eyebrow{font-size:12px; letter-spacing:.3em; font-weight:700; color:var(--gold); text-transform:uppercase; margin:0 0 10px}
  header h1{font-size:30px; margin:0; font-weight:800; letter-spacing:.06em}
  header .rule{width:60px; height:3px; background:linear-gradient(90deg,#e6c97a,#c79a3c); margin:18px auto 14px; border-radius:2px}
  header .ev{font-size:14px; color:#d9e2ec; margin:0}
  main{padding:40px 30px}
  .slide{margin:0 0 26px}
  .slide img{width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 14px rgba(14,37,64,.08); background:#fff}
  footer{background:var(--navy); color:#cdd8e4; padding:28px; text-align:center; font-size:12.5px}
  footer .brand{margin-top:8px; font-size:12px; letter-spacing:.4em; color:var(--gold); font-weight:700}
  @media(max-width:600px){ main{padding:24px 14px} header{padding:36px 20px 30px} header h1{font-size:24px} }
  @media print{
    @page{size:A4; margin:10mm}
    body{background:#fff}
    .wrap{box-shadow:none; max-width:none}
    header{page-break-after:always; padding:100mm 20mm 0; background:var(--navy) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    main{padding:0}
    .slide{page-break-after:always; margin:0; display:flex; align-items:center; justify-content:center; height:265mm}
    .slide:last-child{page-break-after:auto}
    .slide img{max-width:100%; max-height:255mm; width:auto; height:auto; box-shadow:none}
    footer{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Materials</p>
    <h1>学習法資料</h1>
    <div class="rule"></div>
    <p class="ev">夏前最後の逆転合格戦略会議｜2026.7.20（月・海の日）横浜</p>
  </header>

  <main>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-01.jpg" alt="どうやって「志望校に合格する学習習慣」が身につくのか"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-02.jpg" alt="成績上位者に共通する解答ルーティンの違い"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-03.jpg" alt="成績が伸び悩む子の特徴③ 理解が浅いと「作業」を省いてしまう"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-04.jpg" alt="成績が伸び悩む子の特徴② 見たことのある基礎問題しか解けない"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-05.jpg" alt="中堅・難関・最難関 各レベルの学校に必要な学習方法"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-06.jpg" alt="理解不足を「ミス」で片付けない"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-07.jpg" alt="中堅校合格ラインに必要な学習レベル"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-08.jpg" alt="中堅有名校は「原理理解」で十分合格できる"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-09.jpg" alt="学習改善に成功するご家庭の差"></div>
    <div class="slide"><img src="./shiryo/yokohama-shiryo-10.jpg" alt="基礎知識の習得機会は3回与えられている"></div>
  </main>

  <footer>
    夏前最後の逆転合格戦略会議｜学習法資料
    <div class="brand">EDEN</div>
  </footer>

</div>
</body>
</html>
